<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>З ДН ЛЬОХА</title>
  <style>
    body {
      background-color: #ffffcc;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    .main-box {
      background-color: white;
      border: 3px solid black;
      max-width: 95%;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      color: red;
      font-size: 32px;
      margin-bottom: 10px;
    }

    p.greeting {
      font-size: 22px;
      font-weight: bold;
      color: #000;
      background-color: #e6f2ff;
      padding: 15px;
      border: 2px dashed #000;
      margin: 20px 0;
    }

    .voice-btn {
      background-color: #ffcc00;
      border: 2px solid black;
      padding: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .voice-btn:active {
      background-color: #e6b800;
    }

    .photos {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .photos img {
      width: 200px;
      height: auto;
      border: 2px solid black;
      border-radius: 8px;
      flex-shrink: 0;
    }

    footer {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="main-box">
    <h1>🎉 З ДНЕМ НАРОДЖЕННЯ, ЛЬОХА! 🎉</h1>

    <p class="greeting" id="text-to-speak">
      З днем народження тебе, щоб у тебе не було поноса і не здох 🥰🥰🥰
    </p>

    <button class="voice-btn" onclick="speakText()">🔊 Прослухати ще раз</button>

    <div class="photos">
      <img src="https://i.imgur.com/8Q9Z5b3.jpeg" alt="Льоха">
      <img src="https://i.imgur.com/2X8K8M2.jpeg" alt="Льоха">
      <img src="https://i.imgur.com/W9v1K9J.jpeg" alt="Льоха">
      <img src="https://i.imgur.com/7L3mR4P.jpeg" alt="Льоха">
      <img src="https://i.imgur.com/0G1vR8T.jpeg" alt="Льоха">
    </div>

    <footer>
      <p>Коротше, з святом тебе! 🎂🎁</p>
    </footer>
  </div>

  <script>
    function speakText() {
      speechSynthesis.cancel();
      const text = document.getElementById('text-to-speak').innerText;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'uk-UA';
      utterance.rate = 1.0;
      speechSynthesis.speak(utterance);
    }

    window.addEventListener('DOMContentLoaded', () => {
      speakText();
    });

    document.body.addEventListener('click', function startAudioOnFirstClick() {
      if (!speechSynthesis.speaking) {
        speakText();
      }
      document.body.removeEventListener('click', startAudioOnFirstClick);
    }, { once: true });
  </script>

</body>
</html>
